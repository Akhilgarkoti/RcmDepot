<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCM Depot Management Portal - Self Audit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://script.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            --radius-box: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-box);
            padding: 2.2rem 2rem;
            box-shadow: var(--shadow-card);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
        }

        .auth-header h2 span { color: var(--primary); }

        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            font-weight: 600;
        }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label {
            display: block;
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.45rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .back-link:hover { color: var(--primary); }

        .dev-footer {
            margin-top: 1.6rem;
            text-align: center;
            font-size: 0.82rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .dev-footer strong { color: #ffffff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h2>Self Audit <span>Report</span></h2>
            <p>बिना लॉगिन किए अपनी रिपोर्ट सीधे सबमिट करें</p>
        </div>

        <form id="auditForm" onsubmit="submitAuditDirect(event)">
            <div class="form-group">
                <label for="auditDepot">Depot Code / Name</label>
                <input type="text" id="auditDepot" required class="form-control" placeholder="डिपो कोड दर्ज करें">
            </div>

            <div class="form-group">
                <label for="auditType">Audit Type</label>
                <select id="auditType" class="form-control">
                    <option value="Stock Verification">Stock Verification</option>
                    <option value="Daily Operations">Daily Operations</option>
                    <option value="Compliance & Accounts">Compliance & Accounts</option>
                </select>
            </div>

            <div class="form-group">
                <label for="auditRemarks">Remarks / Notes</label>
                <textarea id="auditRemarks" class="form-control" rows="3" placeholder="विवरण यहाँ लिखें..."></textarea>
            </div>

            <button type="submit" id="auditSubmitBtn" class="btn-submit">Submit Report</button>
        </form>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>

    <div class="dev-footer">
        Developed for <strong>Depot</strong>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1cdsjmQpRCr33ruM-6XLHfkkLoqA_mpV6CZ1hcQITB2LemAXGtuV0aqcHxpRRc7xc-A/exec";

        async function jsonpRequest(url) {
            const response = await fetch(url, { method: 'GET', redirect: 'follow' });
            const text = await response.text();
            if (text.includes('(') && text.endsWith(')')) {
                return JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
            }
            return JSON.parse(text);
        }

        async function submitAuditDirect(e) {
            e.preventDefault();
            const depot = document.getElementById('auditDepot').value.trim();
            const type = document.getElementById('auditType').value;
            const notes = document.getElementById('auditRemarks').value.trim();

            if (!depot || !notes) {
                alert("कृपया डिपो कोड और विवरण भरें।");
                return;
            }

            const btn = document.getElementById('auditSubmitBtn');
            btn.disabled = true;
            btn.textContent = "Submitting...";

            try {
                const url = `${SCRIPT_URL}?action=saveAudit&username=DirectUser&depot=${encodeURIComponent(depot)}&type=${encodeURIComponent(type)}&notes=${encodeURIComponent(notes)}`;
                const res = await jsonpRequest(url);

                if (res && res.success) {
                    alert("✅ Self Audit Report सफलतापूर्वक सबमिट हो गई है!");
                    document.getElementById('auditForm').reset();
                } else {
                    alert("⚠️ " + (res.message || "डेटा सेव करने में विफल।"));
                }
            } catch (err) {
                console.error(err);
                alert("⚠️ सर्वर से कनेक्ट करने में त्रुटि हुई।");
            } finally {
                btn.disabled = false;
                btn.textContent = "Submit Report";
            }
        }
    </script>
</body>
</html>
