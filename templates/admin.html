<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RCM Depot Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b132b; color: #f8fafc; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
        .header h1 { color: #38bdf8; font-size: 1.5rem; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .nav-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab-btn { background: #1c2541; border: 1px solid #334155; color: #94a3b8; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .tab-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
        .table-card { background: #1c2541; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; }
        .table-card h2 { margin-bottom: 1rem; font-size: 1.2rem; color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 0.75rem 1rem; border-bottom: 1px solid #334155; font-size: 0.9rem; white-space: nowrap; }
        th { color: #94a3b8; font-weight: 600; background: #131c31; }
        .loading { text-align: center; color: #94a3b8; padding: 2rem; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>RCM Depot - Admin Control Panel</h1>
        <div class="user-info">
            <span id="welcomeUser" style="color: #38bdf8;"></span>
            <a href="/" onclick="sessionStorage.clear()" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="loadData('Depot Master', this)">Depot Master</button>
        <button class="tab-btn" onclick="loadData('Staff Master', this)">Staff Master</button>
        <button class="tab-btn" onclick="loadData('Staff Ledger Entry', this)">Staff Ledger</button>
        <button class="tab-btn" onclick="loadData('Invoice Dispatch Report', this)">Invoice Dispatch</button>
    </div>

    <div class="table-card">
        <h2 id="sheetTitle">Depot Master Records</h2>
        <div id="tableContainer">
            <p class="loading">Fetching live data from Google Sheets...</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1cdsjmQpRCr33ruM-6XLHfkkLoqA_mpV6CZ1hcQITB2LemAXGtuV0aqcHxpRRc7xc-A/exec";

        document.getElementById('welcomeUser').textContent = sessionStorage.getItem("name") ? `Welcome, ${sessionStorage.getItem("name")}` : '';

        function jsonp(url) {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(data);
                };
                const script = document.createElement('script');
                script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
                script.onerror = () => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(new Error("Network Error"));
                };
                document.body.appendChild(script);
            });
        }

        async function loadData(sheetName, button) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(button) button.classList.add('active');
            
            document.getElementById('sheetTitle').textContent = `${sheetName} Records`;
            const container = document.getElementById('tableContainer');
            container.innerHTML = `<p class="loading">Loading data from Google Sheet (${sheetName})...</p>`;

            try {
                const requestUrl = `${SCRIPT_URL}?action=getData&sheet=${encodeURIComponent(sheetName)}`;
                const data = await jsonp(requestUrl);

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `<p class="loading">No records found in this sheet.</p>`;
                    return;
                }

                const headers = Object.keys(data[0]);
                let tableHtml = `<table><thead><tr>`;
                headers.forEach(h => tableHtml += `<th>${h}</th>`);
                tableHtml += `</tr></thead><tbody>`;

                data.forEach(row => {
                    tableHtml += `<tr>`;
                    headers.forEach(h => {
                        let val = row[h] !== undefined ? row[h] : '';
                        if (typeof val === 'string' && val.startsWith('data:image')) {
                            val = `<img src="${val}" style="height:35px; border-radius:4px;">`;
                        }
                        tableHtml += `<td>${val}</td>`;
                    });
                    tableHtml += `</tr>`;
                });

                tableHtml += `</tbody></table>`;
                container.innerHTML = tableHtml;
            } catch (err) {
                container.innerHTML = `<p class="loading" style="color: #f87171;">Failed to load live data: ${err.message}</p>`;
            }
        }

        window.onload = () => loadData('Depot Master', document.querySelector('.tab-btn.active'));
    </script>
</body>
</html>
