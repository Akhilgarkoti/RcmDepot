<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCM Depot Management Portal - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://script.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            --radius-box: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-box);
            padding: 2.2rem 2rem;
            box-shadow: var(--shadow-card);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .admin-trigger-area {
            cursor: pointer;
            user-select: none;
            display: inline-block;
        }

        .auth-header h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
        }

        .auth-header h2 span { color: var(--primary); }

        .auth-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            font-weight: 600;
        }

        .active-badge {
            display: inline-block;
            padding: 0.3rem 0.85rem;
            background: #eef2ff;
            color: var(--primary);
            border: 1px solid #c7d2fe;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label {
            display: block;
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.45rem;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-box input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
            padding: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

        /* Direct Redirect Button */
        .btn-audit-trigger {
            width: 100%;
            padding: 0.8rem;
            background: #f8fafc;
            color: var(--primary);
            border: 1.5px dashed var(--primary);
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-audit-trigger:hover {
            background: #eef2ff;
        }

        .status-msg {
            margin-top: 1rem;
            font-size: 0.84rem;
            text-align: center;
            font-weight: 700;
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            display: none;
        }

        .dev-footer {
            margin-top: 1.6rem;
            text-align: center;
            font-size: 0.82rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .dev-footer strong { color: #ffffff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <!-- Secret triple-click trigger area -->
            <div class="admin-trigger-area" onclick="handleSecretAdminClick()" title="RCM Portal">
                <h2>RCM Depot <span>Portal</span></h2>
                <p id="portalSubText">Depot & Staff Unified Login</p>
            </div>
        </div>

        <div style="text-align: center;">
            <span id="roleBadge" class="active-badge">Secure Portal Access</span>
        </div>

        <form id="loginForm">
            <input type="hidden" id="selectedRoleInput" value="auto">

            <div class="form-group">
                <label for="userName" id="userLabel">Depot Code / Staff ID</label>
                <div class="input-box">
                    <span class="input-icon">👤</span>
                    <input type="text" id="userName" required placeholder="Enter Your Login ID" autocomplete="username" oninput="detectRoleOnInput(this.value)">
                </div>
            </div>

            <div class="form-group">
                <label for="userPassword">Password</label>
                <div class="input-box">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="userPassword" required placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">Login to Portal</button>
            <div id="loginMsg" class="status-msg"></div>
        </form>

        <!-- Redirects to audit.html -->
        <button type="button" class="btn-audit-trigger" onclick="window.location.href='audit.html'">
            <i class="fas fa-clipboard-check"></i> Create Your Self Audit Report
        </button>
    </div>

    <div class="dev-footer">
        Developed for <strong>Depot</strong>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1cdsjmQpRCr33ruM-6XLHfkkLoqA_mpV6CZ1hcQITB2LemAXGtuV0aqcHxpRRc7xc-A/exec";
        let currentRole = "auto";
        let clickCount = 0;
        let clickTimer = null;

        function handleSecretAdminClick() {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            } else if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                enableAdminMode();
            }
        }

        function enableAdminMode() {
            currentRole = "admin";
            document.getElementById('selectedRoleInput').value = "admin";
            document.getElementById('userLabel').textContent = "Master Admin Username";
            document.getElementById('userName').placeholder = "Enter Admin Username";
            document.getElementById('portalSubText').textContent = "Master Admin Portal Login";
            
            const badge = document.getElementById('roleBadge');
            badge.textContent = "🛡️ Admin Mode Unlocked";
            badge.style.background = "#fee2e2";
            badge.style.color = "#991b1b";
            badge.style.borderColor = "#fca5a5";

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.textContent = "Login to Master Admin";
            loginBtn.style.background = "linear-gradient(135deg, #ef4444 0%, #dc2626 100%)";
            
            alert("🔒 Admin mode activated successfully!");
        }

        function detectRoleOnInput(val) {
            if (currentRole === "admin") return;
            const v = val.trim().toUpperCase();
            const badge = document.getElementById('roleBadge');
            const subText = document.getElementById('portalSubText');

            if (v.startsWith('EMP') || v.startsWith('STF')) {
                currentRole = "staff";
                badge.textContent = "👤 Staff Portal Mode";
                subText.textContent = "Staff Portal Login";
            } else if (v.startsWith('D') || v.startsWith('DEP')) {
                currentRole = "depot";
                badge.textContent = "🏬 Depot Portal Mode";
                subText.textContent = "Depot Management Login";
            } else {
                currentRole = "auto";
                badge.textContent = "Secure Portal Access";
                subText.textContent = "Depot & Staff Unified Login";
            }
            document.getElementById('selectedRoleInput').value = currentRole;
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('userPassword');
            pwdInput.type = (pwdInput.type === 'password') ? 'text' : 'password';
        }

        async function jsonpRequest(url) {
            const response = await fetch(url, { method: 'GET', redirect: 'follow' });
            const text = await response.text();
            if (text.includes('(') && text.endsWith(')')) {
                return JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
            }
            return JSON.parse(text);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let role = document.getElementById('selectedRoleInput').value.trim();
            const username = document.getElementById('userName').value.trim();
            const password = document.getElementById('userPassword').value.trim();
            
            if (role === "auto" || !role) {
                role = (username.toUpperCase().startsWith('EMP') || username.toUpperCase().startsWith('STF')) ? "staff" : "depot";
            }

            const btn = document.getElementById('loginBtn');
            const msgBox = document.getElementById('loginMsg');

            btn.disabled = true;
            btn.textContent = "Verifying credentials...";
            msgBox.style.display = 'none';

            try {
                const url = `${SCRIPT_URL}?action=login&role=${encodeURIComponent(role)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                const res = await jsonpRequest(url);

                if (res && res.success) {
                    sessionStorage.clear();
                    sessionStorage.setItem("user", res.username || username);
                    sessionStorage.setItem("name", res.name || "User");
                    sessionStorage.setItem("role", res.role || role);
                    sessionStorage.setItem("depot", res.depot || "");
                    
                    if (res.permissions) {
                        sessionStorage.setItem("permissions", JSON.stringify(res.permissions));
                    }

                    btn.textContent = "Success! Redirecting...";

                    if (role === "depot") window.location.href = "depot.html";
                    else if (role === "staff") window.location.href = "staff.html";
                    else window.location.href = "admin.html";
                } else {
                    msgBox.textContent = "⚠️ " + (res.message || "Invalid username or password.");
                    msgBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = currentRole === "admin" ? "Login to Master Admin" : "Login to Portal";
                }
            } catch (err) {
                msgBox.textContent = "⚠️ Network Error: Unable to reach server.";
                msgBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = currentRole === "admin" ? "Login to Master Admin" : "Login to Portal";
            }
        });
    </script>
</body>
</html>
